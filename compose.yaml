name: buscador-rag

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3001
      API_INTERNAL_URL: http://api:3000
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      CHAT_SESSION_TTL_SECONDS: ${CHAT_SESSION_TTL_SECONDS:-14400}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      ERP_AUTHORIZATION: ${ERP_AUTHORIZATION:?ERP_AUTHORIZATION is required}
      ERP_CACHE_TTL_SECONDS: ${ERP_CACHE_TTL_SECONDS:-300}
      ERP_CATALOG_WARM_INTERVAL_SECONDS: ${ERP_CATALOG_WARM_INTERVAL_SECONDS:-240}
      ERP_INVENTORY_SYNC_INTERVAL_SECONDS: ${ERP_INVENTORY_SYNC_INTERVAL_SECONDS:-30}
      ERP_INVENTORY_FRESH_SECONDS: ${ERP_INVENTORY_FRESH_SECONDS:-60}
      ERP_INVENTORY_STALE_SECONDS: ${ERP_INVENTORY_STALE_SECONDS:-180}
      ERP_CIRCUIT_FAILURE_THRESHOLD: ${ERP_CIRCUIT_FAILURE_THRESHOLD:-5}
      ERP_CIRCUIT_RESET_MS: ${ERP_CIRCUIT_RESET_MS:-15000}
      ERP_COMPANY_CODE: ${ERP_COMPANY_CODE:?ERP_COMPANY_CODE is required}
      ERP_INVENTORY_URL: ${ERP_INVENTORY_URL:?ERP_INVENTORY_URL is required}
      ERP_LOCAL_CACHE_TTL_SECONDS: ${ERP_LOCAL_CACHE_TTL_SECONDS:-30}
      ERP_MAX_CONCURRENCY: ${ERP_MAX_CONCURRENCY:-2}
      ERP_MAX_QUEUE_SIZE: ${ERP_MAX_QUEUE_SIZE:-100}
      ERP_MAX_RETRIES: ${ERP_MAX_RETRIES:-1}
      ERP_PRODUCTS_URL: ${ERP_PRODUCTS_URL:?ERP_PRODUCTS_URL is required}
      ERP_TIMEOUT_MS: ${ERP_TIMEOUT_MS:-60000}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - edge
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.1-alpine}
    user: "999:1000"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf
          "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
          >&3 && grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

volumes:
  redis-data:
  qdrant-data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
